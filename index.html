<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤝</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바로약속 - 실시간 스마트 일정 및 장소 조율 서비스</title>
    <meta name="description" content="가입이나 번거로운 앱 설치 없이, 링크 하나로 30초 만에 끝나는 초경량 실시간 일정/장소 조율 서비스 바로약속입니다." />
    
    <!-- 🌟 Google Fonts integration for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- 💬 Kakao SDK & Kakao Maps API -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a7ebbfa117de429657367c9dfa9061bd&libraries=services&autoload=false"></script>
    
    <!-- Security Script: Block F12, Right Click, and hide API Key from DOM -->
    <script>
      // Block F12 and Developer Tools keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
          (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // Block Right Click Context Menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, true);

      // Remove the script elements containing API keys from the DOM after initialization
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var scripts = document.getElementsByTagName('script');
          for (var i = scripts.length - 1; i >= 0; i--) {
            var src = scripts[i].src;
            if (src && (src.indexOf('dapi.kakao.com') !== -1 || src.indexOf('developers.kakao.com') !== -1)) {
              scripts[i].parentNode.removeChild(scripts[i]);
            }
          }
        }, 1500); // 1.5 seconds delay to ensure Kakao SDK & Map API fully run load callbacks
      });
    </script>
    
    <!-- 🔑 Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
